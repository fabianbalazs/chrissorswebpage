<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árlista - Chrissors</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        .price-container {
            max-width: 800px;
            width: 100%;
            margin-top: 20px;
            text-align: center;
        }
        .price-img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
        }
        .back-nav {
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
            align-items: left;
        }
    </style>
</head>
<body>
    <div class="back-nav">
        <button class="btn btn-outline" onclick="window.location.href='index.html'">← Vissza a főoldalra</button>
    </div>

    <div class="price-container">
        <h1 class="section-title">Aktuális árak</h1>
        <img src="arlista 5.webp" alt="Chrissors Árlista" class="price-img">
    </div>

    <footer style="margin-top: 40px; width: 100%;">
        <p style="text-align: center; color: var(--text-gray); font-size: 0.8rem;">
            Az árváltoztatás jogát fenntartjuk!
        </p>
    </footer>
</body>
</html>
