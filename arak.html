<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árlista - Chrissors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="kepek/logo.webp">
</head>
<body>
    <header class="subpage-header">
        <div class="header-left">
            <img src="kepek/logo.webp" alt="logo" class="logo" onclick="window.location.href='index.html'">
            <span class="header-wordmark">CHRISSORS<span class="header-wordmark-dot">.</span></span>
        </div>
        <a class="btn-back-outline subpage-back" href="index.html">Vissza</a>
    </header>

    <div class="price-wrapper">
        <h2>Szolgáltatások és Árak</h2>
        <div class="location-selector" aria-label="Árlista helyszíne" role="group">
            <button type="button" class="loc-btn active" aria-pressed="true" aria-controls="price-fehergyarmat">Fehérgyarmat</button>
            <button type="button" class="loc-btn" aria-pressed="false" aria-controls="price-debrecen">Debrecen</button>
        </div>
        <div class="price-img-container">
            <img id="price-fehergyarmat" src="kepek/arlista%20fehergyarmat.png" alt="Chrissors árlista – Fehérgyarmat" class="price-img">
            <img id="price-debrecen" src="kepek/arlista%20debrecen.png" alt="Chrissors árlista – Debrecen" class="price-img hidden">
        </div>
        <p class="price-disclaimer">Az árváltoztatás jogát fenntartjuk!</p>
    </div>

    <footer>
        <div class="footer-inner">
            <div class="footer-brand">
                <span class="footer-logo">Chrissors'</span>
                <p class="footer-desc">Prémium hajvágás — Fehérgyarmat &amp; Debrecen</p>
            </div>
            <nav class="footer-nav">
                <a href="impresszum.html">Impresszum</a>
                <a href="adatkezeles.html">Adatkezelés</a>
                <a href="aszf.html">ÁSZF</a>
                <a href="https://www.instagram.com/itschrissors?igsh=MTEzMHhleDFzcGVybg==" target="_blank" class="footer-ig">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/></svg>
                    Instagram
                </a>
            </nav>
        </div>
        <div class="footer-bottom">
            <span>&copy; 2026 Chrissors'. Minden jog fenntartva.</span>
        </div>
    </footer>
    <script>
        const priceButtons = document.querySelectorAll('.price-wrapper .loc-btn');
        priceButtons.forEach(button => {
            button.addEventListener('click', () => {
                priceButtons.forEach(option => {
                    const selected = option === button;
                    option.classList.toggle('active', selected);
                    option.setAttribute('aria-pressed', String(selected));
                    document.getElementById(option.getAttribute('aria-controls')).classList.toggle('hidden', !selected);
                });
            });
        });
    </script>
</body>
</html>
